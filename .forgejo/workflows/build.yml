name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Setup cmake
        uses: https://git.techwritescode.dev/techwritescode/setup-cmake@master

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: /opt/ps2dev
          components: toolchain,cmake,ninja,sdk-core

      # world/ogg (Ogg container format) - a real dependency, not part
      # of setup-sdk's own sdk-core/sdk-world fetch, since ogg is its
      # own standalone repo (same reason this step exists at all -
      # world/ogg has no ps2build update command of its own either).
      - name: Fetch ogg package
        run: |
          release="$(curl -fsSL "https://git.techwritescode.dev/api/v1/repos/ps2/ogg/releases/latest")"
          asset_url="$(printf '%s' "$release" |
            jq -r '[.assets[] | select(.name | test("^ogg-.*\\.zip$")) | .browser_download_url][0]')"
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "no ogg zip asset found" >&2
            exit 1
          fi
          dest=/opt/ps2dev/packages/world/ogg
          mkdir -p "$dest"
          curl -fsSL "$asset_url" -o /tmp/ogg.zip
          unzip -o -q /tmp/ogg.zip -d "$dest"
          rm -f /tmp/ogg.zip

      # CMAKE_MAKE_PROGRAM is set explicitly rather than relying on
      # ninja being on PATH - this runs in a fresh Docker container
      # each time, so "ps2build update ninja"'s install into
      # $PS2DEV/tools/ninja is never actually on PATH here.
      - name: Configure with CMake
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/vorbis \
            -DOGG_INCLUDE_DIR=/opt/ps2dev/packages/world/ogg/include \
            -DOGG_LIBRARY=/opt/ps2dev/packages/world/ogg/lib/libogg.a

      - name: Build
        run: cmake --build build --target vorbis vorbisenc vorbisfile

      - name: Install
        run: cmake --install build

      - name: Get short SHA
        id: slug
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v3
        if: success()
        with:
          name: vorbis-${{ steps.slug.outputs.sha8 }}
          path: /opt/ps2dev/packages/world/vorbis

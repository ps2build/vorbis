name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Clean C:\ps2dev-consumer
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\ps2dev-consumer -ErrorAction SilentlyContinue

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: C:\ps2dev-consumer

      # world/ogg (Ogg container format) - a real dependency, not part
      # of setup-sdk's own sdk-core/sdk-world fetch, since ogg is its
      # own standalone repo (same reason this step exists at all -
      # world/ogg has no ps2build update command of its own either).
      - name: Fetch ogg package
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://git.techwritescode.dev/api/v1/repos/ps2/ogg/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like 'ogg-*-windows-x64.zip' } | Select-Object -First 1
          if (-not $asset) { throw "no windows-x64 asset on the latest ogg release" }
          $zipPath = Join-Path $env:TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          $dest = "C:\ps2dev-consumer\packages\world\ogg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force
          Remove-Item $zipPath -Force

      - name: Configure with CMake
        shell: pwsh
        run: |
          $env:PS2DEV = "C:\ps2dev-consumer"
          cmake -S . -B build -G Ninja `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\vorbis `
            -DOGG_INCLUDE_DIR=C:\ps2dev-consumer\packages\world\ogg\include `
            -DOGG_LIBRARY=C:\ps2dev-consumer\packages\world\ogg\lib\libogg.a

      - name: Build
        shell: pwsh
        run: cmake --build build --target vorbis vorbisenc vorbisfile

      - name: Install
        shell: pwsh
        run: cmake --install build

      - name: Get short SHA
        id: slug
        shell: pwsh
        run: "'sha8=' + $env:GITHUB_SHA.Substring(0,8) >> $env:GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v3
        if: success()
        with:
          name: vorbis-${{ steps.slug.outputs.sha8 }}
          path: C:\ps2dev-consumer\packages\world\vorbis

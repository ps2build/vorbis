name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Clean C:\ps2dev-consumer
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\ps2dev-consumer -ErrorAction SilentlyContinue

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: C:\ps2dev-consumer

      - name: Fetch ogg package
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://git.techwritescode.dev/api/v1/repos/ps2/ogg/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like 'ogg-*.zip' } | Select-Object -First 1
          if (-not $asset) { throw "no ogg zip asset on the latest ogg release" }
          $zipPath = Join-Path $env:TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          $dest = "C:\ps2dev-consumer\packages\world\ogg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force
          Remove-Item $zipPath -Force

      - name: Configure with CMake
        shell: pwsh
        run: |
          $env:PS2DEV = "C:\ps2dev-consumer"
          cmake -S . -B build -G Ninja `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\vorbis `
            -DOGG_INCLUDE_DIR=C:\ps2dev-consumer\packages\world\ogg\include `
            -DOGG_LIBRARY=C:\ps2dev-consumer\packages\world\ogg\lib\libogg.a

      - name: Build
        shell: pwsh
        run: cmake --build build --target vorbis vorbisenc vorbisfile

      - name: Install
        shell: pwsh
        run: cmake --install build

      # Real, unmodified upstream license text, not generated -
      # cmake --install only copies build outputs (include/lib), never
      # the repo's own root COPYING, so without this the release zip
      # would ship real Xiph.org-licensed code with no license text at
      # all.
      - name: Bundle license
        shell: pwsh
        run: Copy-Item COPYING C:\ps2dev-consumer\packages\world\vorbis\COPYING

      # Unsuffixed, matching sdk-core/sdk-world/audsrv - this is
      # cross-compiled PS2 MIPS content, not a host binary.
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path C:\ps2dev-consumer\packages\world\vorbis\* -DestinationPath "vorbis-$version.zip"

      - name: Publish release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          fj release create $version -t $version -a "vorbis-$version.zip" -r ps2/vorbis

      - name: Clean up
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force "vorbis-*.zip" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

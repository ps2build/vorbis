name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: https://git.techwritescode.dev/techwritescode/setup-forgejo@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup cmake
        uses: https://git.techwritescode.dev/techwritescode/setup-cmake@master

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: /opt/ps2dev
          components: toolchain,cmake,ninja,sdk-core,llvm-toolchain

      - name: Fetch ogg packages
        run: |
          release="$(curl -fsSL "https://git.techwritescode.dev/api/v1/repos/ps2/ogg/releases/latest")"
          for set in gcc llvm; do
            asset_url="$(printf '%s' "$release" |
              jq -r --arg set "$set" '[.assets[] | select(.name | test("^ogg-.*-" + $set + "\\.zip$")) | .browser_download_url][0]')"
            if [ "$set" = "gcc" ] && { [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; }; then
              asset_url="$(printf '%s' "$release" |
                jq -r '[.assets[] | select(.name | test("^ogg-v[0-9.]+\\.zip$")) | .browser_download_url][0]')"
            fi
            if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
              echo "no $set ogg zip asset found" >&2
              exit 1
            fi
            if [ "$set" = "gcc" ]; then dest=/opt/ps2dev/packages/world/ogg; else dest=/opt/ps2dev/packages-llvm/world/ogg; fi
            mkdir -p "$dest"
            curl -fsSL "$asset_url" -o /tmp/ogg.zip
            unzip -o -q /tmp/ogg.zip -d "$dest"
            rm -f /tmp/ogg.zip
          done

      # CMAKE_MAKE_PROGRAM is set explicitly rather than relying on
      # ninja being on PATH - this runs in a fresh Docker container
      # each time, so "ps2build update ninja"'s install into
      # $PS2DEV/tools/ninja is never actually on PATH here.
      - name: Configure with CMake
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/vorbis \
            -DOGG_INCLUDE_DIR=/opt/ps2dev/packages/world/ogg/include \
            -DOGG_LIBRARY=/opt/ps2dev/packages/world/ogg/lib/libogg.a

      - name: Build
        run: cmake --build build --target vorbis vorbisenc vorbisfile

      - name: Install
        run: cmake --install build

      - name: Configure with CMake (llvm)
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build-llvm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/ps2dev/cmake/ps2dev_llvm.cmake \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages-llvm/world/vorbis \
            -DOGG_INCLUDE_DIR=/opt/ps2dev/packages-llvm/world/ogg/include \
            -DOGG_LIBRARY=/opt/ps2dev/packages-llvm/world/ogg/lib/libogg.a

      - name: Build (llvm)
        run: cmake --build build-llvm --target vorbis vorbisenc vorbisfile

      - name: Install (llvm)
        run: cmake --install build-llvm

      # Real, unmodified upstream license text, not generated -
      # cmake --install only copies build outputs (include/lib), never
      # the repo's own root COPYING, so without this the release zip
      # would ship real Xiph.org-licensed code with no license text at
      # all.
      - name: Bundle license
        run: |
          cp COPYING /opt/ps2dev/packages/world/vorbis/COPYING
          cp COPYING /opt/ps2dev/packages-llvm/world/vorbis/COPYING

      # Unsuffixed, matching sdk-core/sdk-world/audsrv - this is
      # cross-compiled PS2 MIPS content, not a host binary.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          (cd /opt/ps2dev/packages/world/vorbis && zip -r "$GITHUB_WORKSPACE/vorbis-$version-gcc.zip" .)
          (cd /opt/ps2dev/packages-llvm/world/vorbis && zip -r "$GITHUB_WORKSPACE/vorbis-$version-llvm.zip" .)

      - name: Publish release
        run: |
          version="${GITHUB_REF_NAME}"
          fj release create "$version" -t "$version" -a "vorbis-$version-gcc.zip" -a "vorbis-$version-llvm.zip" -r ps2/vorbis
